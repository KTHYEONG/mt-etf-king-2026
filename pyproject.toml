[project]
name = "mt-etf-king-2026"
version = "0.1.0"
description = "머니투데이 제 3회 ETF 투자왕 대회용 퀀트 프로젝트"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "scratch",
    "logs",
    "results",
    ".pytest_cache",
    ".git",
    ".venv",
    "tools",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit (Security)
    "PERF", # Perflint (Performance)
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ASYNC", # flake8-async
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "S101",   # Allow assert
    "E741",   # Allow ambiguous variable names
    "E501",   # Ignore line length
    "ARG001", # Allow unused function arguments
    "ARG002", # Allow unused method arguments
    "ARG004", # Allow unused static method arguments
    "ARG005", # Allow unused lambda arguments
    "RUF100", # Allow unused noqa directives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E402", "N802", "N803", "N806", "N813", "N814", "ARG", "I001", "RUF059", "F841", "PT015", "PT018", "B011", "RUF003", "F401", "SIM210", "SIM108"]
"tools/agent_skills/lean_check.py" = ["T20", "S607", "S603"]
"src/alpha/baselines.py" = ["S112", "S110", "N814", "S101"]
"src/backtest/engine.py" = ["S112", "S110", "SIM105", "PERF401", "F841", "SIM102", "SIM114", "SIM108"]
"src/backtest/execution.py" = ["S110", "SIM105"]
"src/tournament/distribution.py" = ["S311", "RUF046", "RUF005", "C400", "F841", "S112", "S110", "SIM108", "B007", "PERF401"]
"src/tournament/simulator.py" = ["F841", "RUF005", "RUF046", "PERF401", "SIM105", "S110", "S112"]
"src/tournament/replay.py" = ["S110", "SIM105", "F841", "PERF401"]
"src/backtest/session_cache.py" = ["S112", "S110", "SIM105", "PERF401", "F841", "E402"]
"src/cli.py" = ["S110", "SIM102", "SIM105", "PERF401", "F841", "S112", "SIM210", "SIM108", "B010"]
"src/portfolio/policy.py" = ["S110", "S112", "SIM102", "B007", "F841", "PERF401", "SIM105"]
"src/portfolio/exposure.py" = ["S110", "S112", "F841", "SIM105", "S311"]
"src/portfolio/constraints.py" = ["S110", "S112", "PERF401"]
"src/portfolio/selection.py" = ["S112", "S110", "SIM108", "B007", "PERF401", "SIM105", "F841"]
"src/tournament/harness.py" = ["S110", "S112", "N806", "F841", "SIM105", "PERF401", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
strict = true
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "scratch",
    "logs",
    "results",
    ".pytest_cache",
    ".git",
    ".venv",
    "^tests/.*/conftest\\.py$",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.cli"]
ignore_errors = true

[tool.uv]
cache-dir = "scratch/uv-cache"

[project.scripts]
mt-etf = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.5.0",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" data-skin="current-v1" data-Copy-mode="dark" data-surface-profile="social-card">
  <defs>
    <style>
      .t-eyebrow { font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
      .t-h1 { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      .t-sub { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 600; }
      .t-sec { font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
      .t-kpi { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .t-kpi-md { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .t-card-title { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
      .t-node-title { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
      .t-body { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 14.5px; font-weight: 600; }
      .t-step { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; font-size: 14.5px; font-weight: 700; }
      .t-mono { font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .t-badge { font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; }
</style>
    <marker id="arrow-focus" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" data-fill-role="focus" fill="#6FA3D3"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="560" data-fill-role="canvas" fill="#16191E"/>

  <!-- Header -->
  <g id="header">
    <text x="40" y="42" class="t-eyebrow" data-fill-role="focus" fill="#6FA3D3">MT-ETF-KING-2026 · SYSTEMATIC TOURNAMENT QUANT &amp; EXECUTION PIPELINE</text>
    <text x="40" y="78" class="t-h1" data-fill-role="ink" fill="#E9ECEF">핵심 엔지니어링 보장 지표 및 4단계 실행 파이프라인</text>
    <text x="40" y="104" class="t-sub" data-fill-role="muted" fill="#D8DBDF">Polars 벡터 연산 · 시점 정합성(PIT) 강제 · t+1 시가 체결 원장 · 1,268명 경쟁 군중 시뮬레이션</text>

    <rect x="920" y="34" width="240" height="36" rx="18" data-fill-role="compute-fill" data-stroke-role="compute-line" fill="#263A37" stroke="#5FAE8F" stroke-width="1.5"/>
    <circle cx="942" cy="52" r="5" data-fill-role="positive" fill="#5FAE8F"/>
    <text x="956" y="57" class="t-badge" data-fill-role="compute-ink" fill="#BFDFD2">1,643 TESTS · 6 AST GATES</text>
  </g>

  <!-- 3 KPI Cards -->
  <g id="kpi-row">
    <!-- Card 1: Tail Alpha -->
    <g id="kpi-card-1">
      <rect x="40" y="126" width="356" height="196" rx="14" data-fill-role="surface" data-stroke-role="rule" fill="#20242B" stroke="#363B44" stroke-width="1.5"/>
      <rect x="40" y="126" width="356" height="6" rx="3" data-fill-role="focus" fill="#6FA3D3"/>
      <circle cx="74" cy="166" r="18" data-fill-role="edge-fill" data-stroke-role="edge-line" fill="#2A3746" stroke="#6FA3D3" stroke-width="1.5"/>
      <path d="M 66 172 L 72 164 L 76 168 L 82 158 M 77 158 H 82 V 163" fill="none" data-stroke-role="edge-line" stroke="#6FA3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="102" y="171" class="t-sec" data-fill-role="edge-ink" fill="#C5DAED">METRIC 01 · TOURNAMENT TAIL ALPHA</text>

      <text x="64" y="226" class="t-kpi" data-fill-role="focus" fill="#6FA3D3">7.77% (3.06x)</text>
      <text x="64" y="256" class="t-card-title" data-fill-role="ink" fill="#E9ECEF">36거래일 +30% 초과 달성 확률</text>
      <text x="64" y="282" class="t-body" data-fill-role="muted" fill="#D8DBDF">단순 보유(2.54%) 대비 +5.23%p 우위 확보</text>
      <text x="64" y="304" class="t-mono" data-fill-role="edge-ink" fill="#C5DAED">2,097 Rolling Windows · q95 +43.85%</text>
    </g>

    <!-- Card 2: Causal & Risk -->
    <g id="kpi-card-2">
      <rect x="422" y="126" width="356" height="196" rx="14" data-fill-role="surface" data-stroke-role="rule" fill="#20242B" stroke="#363B44" stroke-width="1.5"/>
      <rect x="422" y="126" width="356" height="6" rx="3" data-fill-role="positive" fill="#5FAE8F"/>
      <circle cx="456" cy="166" r="18" data-fill-role="compute-fill" data-stroke-role="compute-line" fill="#263A37" stroke="#5FAE8F" stroke-width="1.5"/>
      <path d="M 456 156 L 464 160 V 166 C 464 171 460 175 456 177 C 452 175 448 171 448 166 V 160 Z" fill="none" data-stroke-role="compute-line" stroke="#5FAE8F" stroke-width="2" stroke-linejoin="round"/>
      <text x="484" y="171" class="t-sec" data-fill-role="compute-ink" fill="#BFDFD2">METRIC 02 · CAUSAL &amp; RISK GUARD</text>

      <text x="446" y="226" class="t-kpi" data-fill-role="positive" fill="#5FAE8F">0 Look-Ahead</text>
      <text x="446" y="256" class="t-card-title" data-fill-role="ink" fill="#E9ECEF">t+1 시가 체결 &amp; 패밀리 중복 배제</text>
      <text x="446" y="282" class="t-body" data-fill-role="muted" fill="#D8DBDF">assert_pit 시점 검증 · 휴장 더미 세션 차단</text>
      <text x="446" y="304" class="t-mono" data-fill-role="compute-ink" fill="#BFDFD2">CVaR(5%) -21.56% · Gross 위반 0회</text>
    </g>

    <!-- Card 3: Contest & QA -->
    <g id="kpi-card-3">
      <rect x="804" y="126" width="356" height="196" rx="14" data-fill-role="surface" data-stroke-role="rule" fill="#20242B" stroke="#363B44" stroke-width="1.5"/>
      <rect x="804" y="126" width="356" height="6" rx="3" data-fill-role="api-line" fill="#9490C6"/>
      <circle cx="838" cy="166" r="18" data-fill-role="api-fill" data-stroke-role="api-line" fill="#323343" stroke="#9490C6" stroke-width="1.5"/>
      <path d="M 831 166 L 836 171 L 846 161" fill="none" data-stroke-role="api-line" stroke="#9490C6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="866" y="171" class="t-sec" data-fill-role="api-ink" fill="#D4D3E8">METRIC 03 · CONTEST &amp; QUALITY</text>

      <text x="828" y="226" class="t-kpi" data-fill-role="api-ink" fill="#D4D3E8">1,268 × 8,000</text>
      <text x="828" y="256" class="t-card-title" data-fill-role="ink" fill="#E9ECEF">군중 시뮬레이션 &amp; 정적 품질 게이트</text>
      <text x="828" y="282" class="t-body" data-fill-role="muted" fill="#D8DBDF">우승 확률 P(rank=1) +5%p 우위 시 교체</text>
      <text x="828" y="304" class="t-mono" data-fill-role="api-ink" fill="#D4D3E8">fsync 원자적 I/O · AST 400문장 상한</text>
    </g>
  </g>

  <!-- Pipeline Strip -->
  <g id="pipeline-strip">
    <rect x="40" y="346" width="1120" height="184" rx="14" data-fill-role="strip" data-stroke-role="rule" fill="#1F2730" stroke="#363B44" stroke-width="1.5"/>
    <text x="64" y="378" class="t-sec" data-fill-role="focus" fill="#6FA3D3">END-TO-END CAUSAL QUANT &amp; TOURNAMENT EXECUTION LIFECYCLE</text>
    <text x="810" y="378" class="t-mono" data-fill-role="muted" fill="#D8DBDF">Signal @ t 15:30 Close → Fill @ t+1 09:00 Open</text>

    <!-- Stage 1 -->
    <g id="stage-1">
      <rect x="64" y="396" width="242" height="114" rx="10" data-fill-role="edge-fill" data-stroke-role="edge-line" fill="#2A3746" stroke="#6FA3D3" stroke-width="1.5"/>
      <text x="80" y="422" class="t-badge" data-fill-role="edge-ink" fill="#C5DAED">STAGE 01 · DATA MEDALLION</text>
      <text x="80" y="448" class="t-node-title" data-fill-role="ink" fill="#E9ECEF">KRX 수집 &amp; 10단계 검증</text>
      <text x="80" y="472" class="t-body" data-fill-role="muted" fill="#D8DBDF">토큰버킷 · 휴장 더미 차단</text>
      <text x="80" y="494" class="t-mono" data-fill-role="edge-ink" fill="#C5DAED">Gzip Bronze → zstd Silver</text>
    </g>

    <path d="M 306 453 H 330" fill="none" data-stroke-role="focus" stroke="#6FA3D3" stroke-width="2.2" marker-end="url(#arrow-focus)"/>

    <!-- Stage 2 -->
    <g id="stage-2">
      <rect x="338" y="396" width="242" height="114" rx="10" data-fill-role="compute-fill" data-stroke-role="compute-line" fill="#263A37" stroke="#5FAE8F" stroke-width="1.5"/>
      <text x="354" y="422" class="t-badge" data-fill-role="compute-ink" fill="#BFDFD2">STAGE 02 · FEATURE &amp; ALPHA</text>
      <text x="354" y="448" class="t-node-title" data-fill-role="ink" fill="#E9ECEF">PIT 피처 &amp; 적응형 슬리브</text>
      <text x="354" y="472" class="t-body" data-fill-role="muted" fill="#D8DBDF">급락 후 V자 반등 앵커 포착</text>
      <text x="354" y="494" class="t-mono" data-fill-role="compute-ink" fill="#BFDFD2">패밀리 중복 배제 (Max 1)</text>
    </g>

    <path d="M 580 453 H 604" fill="none" data-stroke-role="focus" stroke="#6FA3D3" stroke-width="2.2" marker-end="url(#arrow-focus)"/>

    <!-- Stage 3 -->
    <g id="stage-3">
      <rect x="612" y="396" width="242" height="114" rx="10" data-fill-role="api-fill" data-stroke-role="api-line" fill="#323343" stroke="#9490C6" stroke-width="1.5"/>
      <text x="628" y="422" class="t-badge" data-fill-role="api-ink" fill="#D4D3E8">STAGE 03 · CAUSAL LEDGER</text>
      <text x="628" y="448" class="t-node-title" data-fill-role="ink" fill="#E9ECEF">t+1 시가 체결 &amp; 롤링 평가</text>
      <text x="628" y="472" class="t-body" data-fill-role="muted" fill="#D8DBDF">20일 ADV 유동성 캡 · 슬리피지</text>
      <text x="628" y="494" class="t-mono" data-fill-role="api-ink" fill="#D4D3E8">2,097 × 36d 윈도우 검증</text>
    </g>

    <path d="M 854 453 H 878" fill="none" data-stroke-role="focus" stroke="#6FA3D3" stroke-width="2.2" marker-end="url(#arrow-focus)"/>

    <!-- Stage 4 -->
    <g id="stage-4">
      <rect x="886" y="396" width="250" height="114" rx="10" data-fill-role="surface" data-stroke-role="focus" fill="#20242B" stroke="#6FA3D3" stroke-width="2"/>
      <text x="902" y="422" class="t-badge" data-fill-role="focus" fill="#6FA3D3">STAGE 04 · LIVE &amp; CONTEST</text>
      <text x="902" y="448" class="t-node-title" data-fill-role="ink" fill="#E9ECEF">순위 최적화 &amp; 구간 카드</text>
      <text x="902" y="472" class="t-body" data-fill-role="muted" fill="#D8DBDF">8,000 Worlds 군중 부트스트랩</text>
      <text x="902" y="494" class="t-mono" data-fill-role="focus" fill="#6FA3D3">09:05-09:15 / 15:10-15:19</text>
    </g>
  </g>
</svg>

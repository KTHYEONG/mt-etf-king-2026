    <text x="40" y="74" class="t-h1" data-fill-role="ink" fill="#252B35">4-Tier 메달리온 데이터 파이프라인 및 실전 대회 의사결정 토폴로지</text>
    <text x="40" y="100" class="t-sub" data-fill-role="muted" fill="#363A40">단방향 계층 의존성(Core → Data → Features → Portfolio → Execution → Tournament/Contest) AST 강제</text>

    <rect x="920" y="32" width="240" height="36" rx="18" data-fill-role="edge-fill" data-stroke-role="edge-line" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1.5"/>
    <text x="942" y="55" class="t-badge" data-fill-role="edge-ink" fill="#193C5A">ZERO CYCLIC DEPENDENCY</text>
  </g>


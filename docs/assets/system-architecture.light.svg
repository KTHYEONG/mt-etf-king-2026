    <text x="268" y="208" class="t-body" data-fill-role="muted" fill="#363A40">나노초 토큰버킷 · 일일 쿼터 추적</text>
    <text x="268" y="228" class="t-mono" data-fill-role="edge-ink" fill="#193C5A">krx.py · ratelimit.py</text>


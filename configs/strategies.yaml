# Strategy parameters — leadership (spec 07) and portfolio (spec 08, future)
leadership:
  sector_score_weights:
    rs: 0.45
    accel: 0.30
    breadth: 0.25
    breakout: 0.0
    flow: 0.0
  max_per_theme: 2
  min_cluster_members: 3
  transition:
    rs_in: 0.55
    rs_out: 0.35
    rs_hi: 0.75
    accel_in: -0.08
    accel_out: -0.20
    breadth_in: 0.65
    breadth_out: 0.45
    ext_in: 2.5
    ext_out: 1.5
    dd_in: 0.08
    dd_out: 0.05
    patience: 3

intensity:
  mom_col: mom_20
  allowed_multiples: [1, 2]
  exclude_inverse: true
  exclude_synthetic: true
  exclude_low_confidence: true

portfolio:
  adoption:
    vehicle_conf_min: 0.85
  tail_concentration:
    enabled: true
    tradable_states: ["LEADING", "RECOVERY"]
    risk_on_regimes: ["RISK_ON", "STRONG_RISK_ON"]
    w_top_full: 1.0
    k_full: 1
  lottery_exposure:
    enabled: true
    risk_on_regimes: ["RISK_ON", "STRONG_RISK_ON"]
    w_top: 1.0
    max_gross: 2.0
    suppress_vehicle_gate: true
    suppress_trim: true
    min_gap: 0.0
  sticky_leader:
    mom_col: mom_20
    only_plus_2: true
    no_inverse: true
    min_gap: 0.08
    min_hold: 3
  p21:
    impulse_gap: 0.04
    impulse_require_volx: true
    impulse_col: mom_5
    cash_drawdown: -0.12
    peak_lock: 0.40
  p22:
    collapse_family: true
    min_gap: 0.0
    min_hold: 0
    lock_level: 0.50
  convexity_hold:
    enabled: true
    min_gap: 0.0
    score_drop_pct: 0.30
    crisis_regimes: [STRONG_RISK_OFF]
    w_top: 1.0
    max_gross: 2.0
    skip_capacity_route: true

right_tail_weights:
  0.75: 0.2
  0.90: 0.3
  0.95: 0.3
  0.99: 0.2

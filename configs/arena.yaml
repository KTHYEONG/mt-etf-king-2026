evaluation:
  horizon_sessions: 36
  bootstrap_mean_block: 10
  bootstrap_draws: 5000
  seed: 20261104
  ci_level: 0.95
  exceedance_grid: [1.1, 1.3, 1.5, 2.0, 2.3, 3.0]
  min_sessions: 252
  lock_in: true                 # default policy: flatten once own multiple closes >= W (Part 5g)
  lock_exit_cost_bps: 3.0       # one side, same as simulate cost
  lock_trigger_buffer: 0.01     # margin over W on the 15:19 check
  lock_noise_sd: 0.0093         # Hynix 15:19->close sd at 2x, minute bars n=214
  lock_noise_df: 4.0
panel:
  lock_timeout_s: 900.0          # same wait as the pipeline lock (configs/base.yaml:21)
  nav_divergence_max: 0.10       # |r_cc - r_nav| above this flags a print far from NAV
simulate:
  execution: open                 # open | close: fill price session of d+1
  cost_bps_per_side: 3.0          # ~1.5 bp commission + ~1.5 bp slippage; patient limit orders (5-10 min) avoid the spread
  participation_max: 0.05         # max |trade| as a share of ADV traded value
  adv_window: 20                  # sessions of trading_value used for ADV (ending at d)
  weight_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  weight_tolerance: 1.0e-9
  capacity_equity_max: 3.0       # ADV cap sizes positions at most at 3x the contest capital (36-session windows never compound further)
research:
  discovery_start: 2018-01-02
  holdout_start: 2025-01-02          # holdout is evaluated only through registered views
  regime_reference: "069500"         # KODEX 200
  regime_window: 20
  regime_edges: [0.15, 0.25, 0.40]   # annualized vol: low < 0.15 <= mid < 0.25 <= high < 0.40 <= extreme
  regime_min_sessions: 120
  stress_cost_bps: 9.0               # 3x the base cost (crypto-pilot practice)
  gate_alpha: 0.05
  gate_min_plateau_share: 0.5        # share of the same family's grid with positive drift-neutral edge
  causality_cuts: 3
  annualization: 252
strategies:
  trend:                                   # shared multi-horizon trend score (unfitted)
    horizons: [10, 20, 40, 60, 120]
    vol_window: 60                         # daily std window for normalization
    band: 0.10                             # |score| below band -> neutral
    er_window: 20                          # efficiency ratio window
    er_min: 0.30                           # ER below this -> choppy -> cash (filter variants only)
  sleeves:                                 # name: [signal_ticker, long_2x_ticker]
    kospi200: ["069500", "122630"]
    kosdaq150: ["229200", "233740"]
    semis: ["091160", "494310"]
    battery: ["305720", "462330"]
    it200: ["139260", "243880"]
    nasdaq100: ["133690", "418660"]
    sox: ["381180", "423920"]
    skhynix: ["0193T0", "0193T0"]
    samsung: ["0193W0", "0193W0"]
  # single-stock inverse legs are futures-based; proxy close TE 1.1-1.4% daily (Part 5c)
  inverse: {kospi200: "252670", kosdaq150: "251340", skhynix: "0197X0", samsung: "0193L0"}
  min_listed_sessions: 20                  # a long leg must have this many listed sessions before it can be picked
  trend_switch:                            # family 1: long / cash / inverse on one sleeve
    sleeves: [kospi200, kosdaq150, skhynix, samsung]
    chop_filter: [false, true]
  rotation:                                # family 2: strongest sleeve's long 2x, else KOSPI200 inverse, else cash
    hold: [5, 10]
  flow_contrarian:                         # family 3: fade net creations into leverage vs inverse (KOSPI200)
    flow_window: [5, 20]
    z_window: 60
    z_threshold: 1.0
  committee:                               # family 4: equal vote of trend_switch(kospi200, no filter) and flow_contrarian(flow_window 20)
    enabled: true
  brake:                                   # family 5: trend_switch(kospi200, no filter) + cash after N straight down sessions of the signal
    down_streak: 3
  segment_fade:                            # family 6: intraday fade of the prior close-to-close move on single-stock 2x pairs
    sleeves: [skhynix, samsung]            # long = sleeves[s][1], short = inverse[s]
    signal: [own, vote3]                   # own: sign of the sleeve signal's r_ref at d; vote3: majority with vote_basket
    overnight: [cash, long]                # overnight book after the close of d+1
    vote_basket: ["091160", "069500"]
  baselines:                               # reference only; track "<track>-baseline", never selected
    hold: ["122630", "0193T0", "0193W0"]
    coin_pair: ["122630", "252670"]
    coin_seed: 20261105
proxy:                                   # research-only synthetic pre-listing history of single-stock leveraged ETFs
  tag: single_stock_proxy_v1             # recorded in every proxy-run trial's params (Part 5d)
  execution: close                       # proxy open legs track at 2.4-3.0% daily TE, so proxy runs fill at the close
  drag_bps_per_session: 5.0              # fee + financing + rebalance drag; overlap mean residual -3.7..-5.9 bp (long 2x)
  max_abs_session_return: 0.30           # KRX daily price limit; a larger underlying move means a bad base price
  min_overlap_sessions: 60
  min_close_corr: 0.99
  max_close_te_bps: 150.0
  products:                              # ETF ticker: KOSPI underlying and daily-reset multiple
    "0193T0": {underlying: "000660", multiple: 2.0}
    "0193W0": {underlying: "005930", multiple: 2.0}
    "0197X0": {underlying: "000660", multiple: -2.0}
    "0193L0": {underlying: "005930", multiple: -2.0}
segment:                                 # open + close executions per session (intraday book / overnight book)
  cost_bps_per_side: 3.0                 # same execution model as simulate: patient limit orders at 09:05-09:15 / 15:10-15:20
  stress_cost_bps: 9.0                   # 3x base (crypto-pilot STRESS_COST_MULTIPLIER practice)
prize_line_vol:                          # descriptive vol-scaled prize line on real windows (Part 5h)
  reference: "0193T0"                   # Hynix single-stock 2x: the most volatile sponsor vehicle
  lookback: 60                          # sessions strictly before each window start
  ks: [0.9, 1.3]                        # implied k: 2026 ~0.89, 2025 ~1.34
  twin_draws: 20
  seed: 20261105
card:                                    # single morning card (src/arena/card.py); one-line strategy switch
  strategy_id: "segment_fade:skhynix:vote3:long"
  edition: 2026
  lock_k: 1.0                            # W = exp(k * sigma_pre * sqrt(H)) (prize_line_vol reference)
  w_fixed: null                          # number overrides lock_k
  open_window: "09:05~09:15"
  close_window: "15:10~15:19"
  output_dir: "card"                     # under <data-root>/results/

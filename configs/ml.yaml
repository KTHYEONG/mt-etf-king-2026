ml:
  # ML 학습·검증·채택 판정은 deployment universe (후원사 ETF) 기준.
  universe_mode: deployment

  label:
    horizon: 10
    target: cs_percentile_rank

  cv:
    scheme: purged_walk_forward
    purge: 10
    embargo: 10
    n_folds: 6
    window: expanding

  capacity:
    num_leaves: 8
    max_depth: 4
    min_data_in_leaf: 100
    max_features: 25
    feature_fraction: 0.6
    bagging_fraction: 0.8
    lambda_l2: 1.0

ml:
  # ML 학습·검증·채택 판정은 deployment universe (후원사 ETF) 기준.
  universe_mode: deployment

  label:
    horizon: 10
    target: cs_percentile_rank

  cv:
    scheme: purged_walk_forward
    purge: 10
    embargo: 10
    n_folds: 6
    window: expanding

  capacity:
    num_leaves: 8
    max_depth: 4
    min_data_in_leaf: 100
    max_features: 25
    feature_fraction: 0.6
    bagging_fraction: 0.8
    lambda_l2: 1.0
  champion_tail:
    candidate_mode: p27_matched_2x
    seed: 20260831
    num_leaves: 8
    max_depth: 4
    min_data_in_leaf: 100
    max_features: 25
    lambda_l2: 1.0
    label_horizon: 36
    embargo: 36
    purge: 36
    n_folds: 3
    min_train_sessions: 252
    costs:
      commission_bps: 3.0
      slippage_bps: 5.0
      spread_bps: 0.0
      tax_bps: 0.0
    feature_columns: [mom_3, mom_5, mom_10, mom_20, mom_40, mom_60, ma_ratio_20, drawdown_20, volume_expansion]
